# Local databases for the SkyVoyage backend.
#   docker compose up -d      start PostgreSQL + Redis
#   docker compose down       stop them (data is kept in the volume)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skyvoyage
      POSTGRES_PASSWORD: skyvoyage
      POSTGRES_DB: skyvoyage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyvoyage"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
